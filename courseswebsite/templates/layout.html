<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <header>
        <div class="header">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
                    <title id="title">UpSkill</title>
                    <desc id="desc">Бирюзовая стрелка роста над тремя ступенями на прозрачном фоне</desc>
                    <path d="M11 47h10V35H11v12Zm16 0h10V27H27v20Zm16 0h10V17H43v30Z" fill="#2C685B"/>
                    <path d="m12 31 13-9 9 4 17-15" fill="none" stroke="#F0FFFC" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
                    <path d="M42 11h9v9" fill="none" stroke="#43B19A" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
                </svg>
                <a href='/'><span>UpSkill</span></a>
            </div>
            <div class="navbar">
                <a href="">ГЛАВНАЯ</a>
                <a href="#">ВИДЕОКУРСЫ</a>
                <a href="#">ПРО НАС</a>
            </div>
            <div class="menu"></div>
        </div>
    </header>

    <main>
        {% block main %}{% endblock %}
    </main>

    <footer>
        <div class="footer-container">
            <h4>Все права защищены &copy;</h4>
        </div>
    </footer>
</body>
</html>
