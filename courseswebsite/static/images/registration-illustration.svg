<svg xmlns="http://www.w3.org/2000/svg" viewBox="23.27 23.27 465.46 465.46" role="img" aria-labelledby="title desc">
  <title id="title">Создание аккаунта</title>
  <desc id="desc">Иллюстрация регистрации: пользователь заполняет карточку нового аккаунта</desc>

  <!-- Background accents -->
  <circle cx="103" cy="109" r="54" fill="#2C685B"/>
  <path d="m360 119 15 15 31-34" fill="none" stroke="#43B19A" stroke-linecap="round" stroke-linejoin="round" stroke-width="9" transform="translate(-279 -11)"/>
  <!-- Signup card -->
  <rect x="111" y="111" width="290" height="318" rx="24" fill="#0F2423" stroke="#43B19A" stroke-width="5"/>
  <path d="M111 135a24 24 0 0 1 24-24h242a24 24 0 0 1 24 24v34H111v-34Z" fill="#1A3D3C"/>
  <circle cx="138" cy="143" r="5" fill="#43B19A"/>
  <circle cx="156" cy="143" r="5" fill="#3B8C7B"/>
  <circle cx="174" cy="143" r="5" fill="#2C685B"/>
  <path d="M333 143h42" stroke="#3B8C7B" stroke-linecap="round" stroke-width="5"/>

  <!-- New account avatar -->
  <circle cx="256" cy="218" r="43" fill="#2C685B"/>
  <circle cx="256" cy="207" r="17" fill="#F0FFFC"/>
  <path d="M222 250c4-20 17-30 34-30s30 10 34 30" fill="#43B19A"/>

  <!-- Form fields -->
  <rect x="157" y="278" width="198" height="39" rx="9" fill="#1A3D3C" stroke="#2C685B" stroke-width="2"/>
  <circle cx="177" cy="292" r="7" fill="none" stroke="#43B19A" stroke-width="3"/>
  <path d="M164 309c1-7 6-10 13-10s12 3 13 10" fill="none" stroke="#43B19A" stroke-linecap="round" stroke-width="3"/>
  <path d="M203 297h119" stroke="#3B8C7B" stroke-linecap="round" stroke-width="5"/>

  <rect x="157" y="329" width="198" height="39" rx="9" fill="#1A3D3C" stroke="#2C685B" stroke-width="2"/>
  <path d="M172 348h12m8 0h12m8 0h12m8 0h12" stroke="#43B19A" stroke-linecap="round" stroke-width="5"/>
  <path d="M245 348h77" stroke="#3B8C7B" stroke-linecap="round" stroke-width="5"/>

  <!-- Create account action -->
  <rect x="157" y="385" width="198" height="14" rx="7" fill="#2C685B"/>
  <path d="M226 392h60" stroke="#F0FFFC" stroke-linecap="round" stroke-width="4"/>

  <!-- Floating welcome spark -->
  <circle cx="397" cy="357" r="39" fill="#43B19A" stroke="#0F2423" stroke-width="8"/>
  <path d="M397 337v40m-20-20h40" stroke="#060E0E" stroke-linecap="round" stroke-width="6"/>

  <!-- Grounding shadow -->
  <path d="M72 458h368" stroke="#3B8C7B" stroke-linecap="round" stroke-width="8"/>
</svg>
